name: Develop

# Every merge to develop builds the site and deploys it to the develop environment in Azure.

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: site
      - run: pnpm build
        working-directory: site
        env:
          VITE_FORGE_CHANNEL: dev
          VITE_HUB_URL: ${{ vars.HUB_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/dist

  deploy:
    needs: build
    permissions:
      contents: read
      id-token: write
    uses: contest-keeper/ck-infra/.github/workflows/deploy-website.yml@develop
    secrets:
      cloudflare_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    with:
      environment: develop
      infra_ref: develop
      artifact: site
