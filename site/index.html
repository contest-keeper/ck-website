<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://api.github.com; object-src 'none'; base-uri 'self'; form-action 'none'" />
    <meta name="color-scheme" content="light dark" />
    <title>Contest Keeper</title>
    <meta name="description" content="Build contest computers on USB sticks, and watch every one from your Hub." />
    <script>
      // Apply the saved look and theme before first paint, so the page never flashes the wrong one.
      try {
        const l = localStorage.getItem('ck-look');
        const m = localStorage.getItem('ck-mode');
        const d = document.documentElement.dataset;
        d.look = l === 'classic' ? 'classic' : 'modern';
        d.mode = m === 'dark' || m === 'light' ? m : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch {
        document.documentElement.dataset.look = 'modern';
        document.documentElement.dataset.mode = 'light';
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
